name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with: { luaVersion: "5.1" }
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted && luarocks install luacheck
      - name: Guard — no private development material in the public repo
        run: |
          for f in CLAUDE.md CLAUDE.local.md .claude docs research README-WORKSPACE.md; do
            if [ -e "$f" ]; then echo "::error::$f must not be committed to the public repo"; exit 1; fi
          done
      - run: make lint
      - run: make test
