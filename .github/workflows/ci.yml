name: ci
on: [push, pull_request]
env:
  LUA: lua   # gh-actions-lua installs the 5.1 interpreter as plain `lua`; the Makefile and tools/ default to lua5.1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: the mutation gate diffs against the push/PR base, which a depth-1 checkout
        # does not have.
        with: { fetch-depth: 0 }
      - uses: leafo/gh-actions-lua@v10
        with: { luaVersion: "5.1" }
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted && luarocks install luacheck && luarocks install luacov
      - name: Guard — no private development material in the public repo
        run: |
          for f in CLAUDE.md CLAUDE.local.md .claude docs research README-WORKSPACE.md; do
            if [ -e "$f" ]; then echo "::error::$f must not be committed to the public repo"; exit 1; fi
          done
      # tools/ gates the rest of CI, so a bug in it silently weakens every check below.
      # Elmira/Libs/ is gitignored -- the packager supplies it -- but tests/spec/init_spec.lua runs
      # Core/Init.lua against the REAL Ace3 rather than a fake of it, so the suite needs the libraries
      # present. Without this, `make test` fails on a fresh checkout while passing on every developer
      # machine that has run `make libs`.
      - name: Fetch embedded libraries (init_spec runs against the real Ace3)
        # The packager refuses to run on a branch push whose commit also carries a tag ("Found
        # future tag"), which is exactly what the main-branch run of every release commit is. Only
        # the libraries are wanted here, so drop the local tag first; the tag-ref run is unaffected.
        # Several externals in .pkgmeta live on repos.wowace.com, which the packager checks out with
        # svn; the stock runner image ships without it.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion >/dev/null
          git tag -d $(git tag --points-at HEAD) 2>/dev/null || true
          make libs

      - name: Shellcheck the quality gates
        run: shellcheck tools/*.sh

      - run: make lint
      - run: make test

      # `make test` proves the suite is green. These two prove the suite would NOTICE a regression,
      # which is a different question and the one this project keeps getting wrong: a covered function
      # whose call site nothing exercises passes every check above while doing nothing.
      - name: Coverage — no shipped file may be unreachable from the suite
        run: make coverage

      # The gates decide whether everything above is trusted, so they get tested too. Each case here
      # is a defect that actually shipped and made the gate report a vacuous pass.
      - name: Self-test the quality gates
        run: make selftest

      # Diff-scoped, so it costs seconds: every line this push changed is deleted in a throwaway copy
      # and the suite must go red. A survivor is a changed line no test actually checks.
      - name: Mutation gate — every changed line must be protected by a test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # First push of a branch reports an all-zero "before"; fall back to the parent commit.
          case "$BASE" in ""|0000000*) BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)" ;; esac
          BASE="$BASE" JOBS=4 make mutants
